<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ANTHAVEN — an ant colony simulator for Android by GrigoriyArx.">
  <title>ANTHAVEN · GrigoriyArx</title>
  <style>
    :root{--bg:#000;--ink:#f3e9d2;--muted:#a99c84;--accent:#e9a64a;--line:#3a2a18}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
    img{width:min(520px,100%);height:auto;display:block}
    p{max-width:520px;margin:8px 0 0;color:var(--muted);line-height:1.5}
    nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
    a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:12px 22px;font-size:15px}
    a:hover,a:focus-visible{border-color:var(--accent);color:var(--accent)}
    a.main{background:var(--accent);border-color:var(--accent);color:#1a0f05;font-weight:600}
    footer{margin-top:40px;font-size:13px;color:var(--muted)}
    footer a{border:0;padding:0;color:var(--muted);text-decoration:underline}
  </style>
</head>
<body>
  <img src="logo.jpg" alt="ANTHAVEN — Ant Colony Simulator" width="900" height="900">
  <p>Watch a living ant colony grow on your phone: feed it, water it, decorate the arena, and come back to see what happened while you were away.</p>
  <nav>
    <a class="main" href="https://play.google.com/store/apps/details?id=com.grigoriyarx.anthaven">Get it on Google Play</a>
    <a href="/anthaven/">Privacy Policy</a>
  </nav>
  <footer>© 2026 GrigoriyArx · <a href="mailto:anthaven.game@gmail.com">anthaven.game@gmail.com</a></footer>
</body>
</html>
